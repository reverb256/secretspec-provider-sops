# secrets.automation.yaml — Phase 2 SOPS target. n8n + Ansible + act_runner.
#
# N8N_WEBHOOK_SECRET is a hex HMAC key (declared `type = "hex"` in
# secretspec.toml). ANSIBLE_VAULT_PASSWORD unlocks the homelab's
# Ansible Vault files (`ansible-vault view ...`).
#
# HOMELAB_RUNNER_REG_TOKEN is CI-side (runner registration); stays
# at `env://` in Phase 3 — the SOPS file is only for repo rotation.

n8n_api_key: "REPLACE_ME_N8N_API_KEY"
n8n_webhook_secret: "REPLACE_ME_N8N_WEBHOOK_SECRET"   # hex HMAC; replace with 64-char hex
ansible_vault_password: "REPLACE_ME_ANSIBLE_VAULT_PASSWORD"
homelab_runner_reg_token: "REPLACE_ME_HOMELAB_RUNNER_REG_TOKEN"
