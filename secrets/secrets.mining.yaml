# secrets.mining.yaml — Phase 2 SOPS target. Mining pool + wallet keys.
#
# ⚠ Wallet-key blocklist: ETHEREUM_WALLET_KEY + MONERO_WALLET_KEY must
# NEVER resolve from `keyring://`. They're either `onepassword://`
# (daily use) or `sops://` cold-storage. sops-provider-design.md ↗
# "Wallet key blocklist" is the canonical statement.
#
# ETHEREUM_WALLET_ADDRESS + MONERO_WALLET_ADDRESS are PUBLIC values —
# including them in secrets.ai/yml is intentional, mirrors the
# migration-matrix.md Phase 2 row parity, and doesn't expose any key.

ethereum_wallet_key: "REPLACE_ME_ETHEREUM_WALLET_KEY"
monero_wallet_key: "REPLACE_ME_MONERO_WALLET_KEY"
ethereum_wallet_address: "REPLACE_ME_ETHEREUM_WALLET_ADDRESS"
monero_wallet_address: "REPLACE_ME_MONERO_WALLET_ADDRESS"
mining_pool_user: "REPLACE_ME_MINING_POOL_USER"
mining_pool_pass: "REPLACE_ME_MINING_POOL_PASSWORD"
