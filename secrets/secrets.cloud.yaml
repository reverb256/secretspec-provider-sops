# secrets.cloud.yaml — Phase 2 SOPS target. Cloud-provider credentials.
#
# Per migration-matrix.md Phase 3 routing, most keys in this file end up
# in `onepassword://Homelab/Cloud`; HOMELAB_DUCKDNS_TOKEN stays per-host
# in `keyring://` because DuckDNS tokens are issued per-update-token.
#
# ACME_ACCOUNT_KEY is sensitive (it's the Let's Encrypt EAB key); all
# other keys here handle third-party cloud-provider auth.

cloudflare_tunnel_token: "REPLACE_ME_CLOUDFLARE_TUNNEL_TOKEN"
cloudflare_api_key: "REPLACE_ME_CLOUDFLARE_API_KEY"
cloudflare_email: "REPLACE_ME_CLOUDFLARE_EMAIL"
cloudflare_zone_id: "REPLACE_ME_CLOUDFLARE_ZONE_ID"
tailscale_auth_key: "REPLACE_ME_TAILSCALE_AUTH_KEY"
homelab_duckdns_token: "REPLACE_ME_HOMELAB_DUCKDNS_TOKEN"
acme_account_key: "REPLACE_ME_ACME_ACCOUNT_KEY"
