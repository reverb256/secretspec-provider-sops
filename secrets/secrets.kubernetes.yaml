# secrets.kubernetes.yaml — Phase 2 SOPS target. K3s cluster bootstrap.
#
# Per migration-matrix.md Phase 3 routing, all four keys in this file
# ultimately land at `vault://…/v1/secret/data/<key>?auth=approle` via
# astral-key. Phase 2 stops at SOPS in-repo.
#
# KUBECONFIG_ADMIN is currently base64-in-env (Phase 1) and migrates to
# raw-file via `as_path = true` in Phase 3.

k3s_cluster_token: "REPLACE_ME_K3S_CLUSTER_TOKEN"
kubeconfig_admin: "REPLACE_ME_KUBECONFIG_ADMIN_BASE64"
kubeadmin_password: "REPLACE_ME_KUBEADMIN_PASSWORD"
k3s_kubelet_token: "REPLACE_ME_K3S_KUBELET_TOKEN"
