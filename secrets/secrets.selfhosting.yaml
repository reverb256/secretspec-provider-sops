# secrets.selfhosting.yaml — Phase 2 SOPS target. Vaultwarden + media stack.
#
# VAULTWARDEN_ADMIN_TOKEN, MAIL_SERVER_PASSWORD, and VAULTWARDEN_SMTP_PASSWORD
# route through `vault://…?auth=approle` via astral-key in Phase 3
# (Vaultwarden IS the password backend; mail-server creds ride along).
#
# JELLYFIN_API_KEY / PAPERLESS_API_TOKEN / PHOTOPRISM_ADMIN_PASSWORD /
# MEALIE_API_KEY all stay at `onepassword://Homelab/SelfHosting`.
#
# NETWORK_WIFI_PASSWORD is per-host (low-risk, rolled only when the
# AP's PSK rotates); Phase 3 final home is `keyring://` per-host.

vaultwarden_admin_token: "REPLACE_ME_VAULTWARDEN_ADMIN_TOKEN"
mail_server_password: "REPLACE_ME_MAIL_SERVER_PASSWORD"
jellyfin_api_key: "REPLACE_ME_JELLYFIN_API_KEY"
paperless_api_token: "REPLACE_ME_PAPERLESS_API_TOKEN"
photoprism_admin_password: "REPLACE_ME_PHOTOPRISM_ADMIN_PASSWORD"
mealie_api_key: "REPLACE_ME_MEALIE_API_KEY"
vaultwarden_smtp_password: "REPLACE_ME_VAULTWARDEN_SMTP_PASSWORD"
network_wifi_password: "REPLACE_ME_NETWORK_WIFI_PASSWORD"
