# secrets.monitoring.yaml — Phase 2 SOPS target. Grafana + Prometheus + Loki + UptimeRobot.
#
# Per migration-matrix.md Phase 3 routing, four of these keys end up
# behind `vault://…?auth=approle` via astral-key
# (GRAFANA_ADMIN_PASSWORD, PROMETHEUS_REMOTE_WRITE_TOKEN, LOKI_INGEST_TOKEN,
# GRAFANA_OAUTH_CLIENT_SECRET). UPTIME_ROBOT_API_KEY stays at
# `onepassword://Homelab/Monitoring` since it's a single third-party API key.

grafana_admin_password: "REPLACE_ME_GRAFANA_ADMIN_PASSWORD"
prometheus_remote_write_token: "REPLACE_ME_PROMETHEUS_REMOTE_WRITE_TOKEN"
loki_ingest_token: "REPLACE_ME_LOKI_INGEST_TOKEN"
uptime_robot_api_key: "REPLACE_ME_UPTIME_ROBOT_API_KEY"
grafana_oauth_client_secret: "REPLACE_ME_GRAFANA_OAUTH_CLIENT_SECRET"
