# Homelab secrets — Phase 1 of the sops-nix → SecretSpec migration.
#
# This file declares every secret required by the homelab stack. Storage is
# deliberately kept identical to today (env + dotenv for Phase 1); later phases
# migrate individual secrets to `keyring://`, `onepassword://`, or `sops://`
# (when cachix/secretspec PR #58 lands).
#
# NOTES on scope:
# - This declaration covers ~25 secrets as a *representative subset* of the ~50
#   secrets in the actual `sops-secrets-registry.nix`; expand via PR before
#   considering Phase 1 complete. CONTEXT.md inventory section is the source.
# - `generate` is intentionally not used here. SOPS doesn't generate; per
#   sops-provider-design.md § "Open questions", `generate` semantics will live
#   on a wrapping provider, not on the sops layer.
# - `composed` (≥ 0.16) is not used either — none of the current secrets are
#   trivially derivable from another. Reconsider when per-scope GitHub tokens
#   enter the registry.
#
# See ../CONTEXT.md → "Migration Path: sops-nix → SecretSpec" for the full plan.
# See ../sops-provider-design.md for the upstream crate this declaration targets.

[project]
name = "homelab-secrets"
revision = "1.0"
# extends = ["../shared/secretspec.toml"]   # future: shared upstream declarations

# ----------------------------------------------------------------------------
# Providers — Phase 1 only.
# ----------------------------------------------------------------------------
# CONTEXT.md Phase 1 explicitly says "Use dotenv or env providers initially":
# that's what we ship. keyring / onepassword / sops are added in later phases.
# (Listed commented-out below as a forward declaration.)
[providers]
env    = "env://"
dotenv = "dotenv://.env.secrets"
# Phase 3: keyring (personal dev), onepassword/astral_vault (team).
# keyring     = "keyring://"
# onepassword = "onepassword://Homelab"
# astral_vault = "vault://http://astral-key:8080/v1/secret?auth=approle"
# Phase 2 once PR #58 merges: sops (read existing .age-encrypted files).
# sops         = "sops://secrets.yaml"

# ----------------------------------------------------------------------------
# Default profile — every secret required across all environments.
# Production and development profiles auto-inherit from this and only need to
# override what differs.
# ----------------------------------------------------------------------------
[profiles.default]

# === AI services ============================================================
NVIDIA_API_KEY    = { description = "NVIDIA NGC API key", required = true, type = "password" }
OPENAI_API_KEY    = { description = "OpenAI API key (chat, research, embeddings)", required = true, type = "password" }
ANTHROPIC_API_KEY = { description = "Anthropic Claude API key", required = true, type = "password" }

# === CI =====================================================================
GITHUB_TOKEN      = { description = "GitHub PAT for repo automation and CI", required = true }
GITHUB_RUNNER_PAT = { description = "Self-hosted GitHub Actions runner PAT", required = true }

# === Cloud ==================================================================
CLOUDFLARE_TUNNEL_TOKEN = { description = "cloudflared tunnel credential JSON", required = true, type = "password" }
CLOUDFLARE_API_KEY      = { description = "Cloudflare API key (DNS edit permissions)", required = true, type = "password" }
TAILSCALE_AUTH_KEY      = { description = "Tailscale preauth key for new nodes", required = true }

# === Storage ================================================================
# Master age encryption keys deliberately excluded from `keyring://` per
# sops-provider-design.md "Wallet key blocklist" — OS keyring is exfiltratable
# by local malware. BACKUP_ENCRYPTION_KEY falls under that blocklist (it's a
# master age encryption key), alongside the wallet keys in the Mining section.
GARAGE_ACCESS_KEY     = { description = "Garage S3 access key", required = true }
GARAGE_SECRET_KEY     = { description = "Garage S3 secret key", required = true, type = "password" }
BACKUP_ENCRYPTION_KEY = { description = "Restic/rclone age encryption key", required = true, type = "password" }

# === Kubernetes =============================================================
K3S_CLUSTER_TOKEN = { description = "K3s cluster bootstrap token", required = true, type = "password" }
# base64 in env for Phase 1; later we'll revisit with as_path for raw file writes.
KUBECONFIG_ADMIN  = { description = "Base64-encoded admin kubeconfig (Phase 1)", required = true }
# KUBECONFIG_ADMIN_FUTURE = { description = "Path-mode admin kubeconfig", required = true, as_path = true }

# === Mining =================================================================
# Wallet keys deliberately excluded from `keyring://` per sops-provider-design.md
# blocklist (OS keyring is exfiltratable by local malware). These must resolve
# from `onepassword://` for daily use or `sops://` once PR #58 lands.
ETHEREUM_WALLET_KEY = { description = "ETH wallet private key for mining pool", required = true, type = "password" }
MONERO_WALLET_KEY   = { description = "XMR wallet private key for mining pool", required = true, type = "password" }
MINING_POOL_USER    = { description = "Mining pool username", required = true }
MINING_POOL_PASS    = { description = "Mining pool password", required = true, type = "password" }

# === Monitoring =============================================================
GRAFANA_ADMIN_PASSWORD        = { description = "Initial Grafana admin password", required = true, type = "password" }
PROMETHEUS_REMOTE_WRITE_TOKEN = { description = "Prometheus remote-write bearer token", required = true }

# === Automation =============================================================
N8N_API_KEY        = { description = "n8n API key", required = true, type = "password" }
N8N_WEBHOOK_SECRET = { description = "HMAC secret for n8n inbound webhooks", required = true, type = "hex" }

# === Self-hosting ===========================================================
VAULTWARDEN_ADMIN_TOKEN = { description = "Vaultwarden admin token", required = true, type = "password" }
MAIL_SERVER_PASSWORD    = { description = "Mail server admin password", required = true, type = "password" }


# ----------------------------------------------------------------------------
# Production profile — enforce strong-encrypted storage, env kept as last fallback.
# ----------------------------------------------------------------------------
[profiles.production.defaults]
providers = ["onepassword", "keyring", "env"]


# ----------------------------------------------------------------------------
# Development profile — placeholder defaults so local dev works without a vault.
# Only the AI provider keys have placeholders; everything else still resolves
# from env or dotenv (which it does today). Description is inherited from default.
# ----------------------------------------------------------------------------
[profiles.development]
# Description may inherit from [profiles.default] but we repeat it explicitly
# — inheritance is documented for field *values*, not confirmed for `description`.
NVIDIA_API_KEY    = { description = "NVIDIA NGC API key", default = "nvapi-replace-me-locally" }
OPENAI_API_KEY    = { description = "OpenAI API key (chat, research, embeddings)", default = "sk-replace-me-locally" }
ANTHROPIC_API_KEY = { description = "Anthropic Claude API key", default = "ant-replace-me-locally" }
