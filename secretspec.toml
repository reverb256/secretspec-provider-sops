# Homelab secrets — Phase 1 of the sops-nix → SecretSpec migration.
#
# This file declares every secret required by the homelab stack. Storage is
# deliberately kept identical to today (env + dotenv for Phase 1); later phases
# migrate individual secrets to `keyring://`, `onepassword://`, or `sops://`
# (when cachix/secretspec PR #58 lands).
#
# NOTES on scope:
# - This is the full 49-entry declaration covering every secret in the actual
#   `sops-secrets-registry.nix` — Phase 1 close-of-scope. CONTEXT.md inventory
#   is the source. See `migration-matrix.md` for the per-secret Phase 1→2→3
#   routing.
# - `generate` is intentionally not used here. SOPS doesn't generate; per
#   sops-provider-design.md § "Open questions", `generate` semantics will live
#   on a wrapping provider, not on the sops layer.
# - `composed` (≥ 0.16) is not used either — none of the current secrets are
#   trivially derivable from another. Reconsider when per-scope GitHub tokens
#   enter the registry.
#
# See ../CONTEXT.md → "Migration Path: sops-nix → SecretSpec" for the full plan.
# See ../sops-provider-design.md for the upstream crate this declaration targets.

[project]
name = "homelab-secrets"
revision = "1.0"
# extends = ["../shared/secretspec.toml"]   # future: shared upstream declarations

# ----------------------------------------------------------------------------
# Providers — Phase 1 only.
# ----------------------------------------------------------------------------
# CONTEXT.md Phase 1 explicitly says "Use dotenv or env providers initially":
# that's what we ship. keyring / onepassword / sops are added in later phases.
# (Listed commented-out below as a forward declaration.)
[providers]
env    = "env://"
dotenv = "dotenv://.env.secrets"
# Phase 3: keyring (personal dev), onepassword/astral_vault (team).
# keyring     = "keyring://"
# onepassword = "onepassword://Homelab"
# astral_vault = "vault://http://astral-key:8080/v1/secret?auth=approle"
# Phase 2 once PR #58 merges: sops (read existing .age-encrypted files).
# sops         = "sops://secrets.yaml"

# ----------------------------------------------------------------------------
# Default profile — every secret required across all environments.
# Production and development profiles auto-inherit from this and only need to
# override what differs.
# ----------------------------------------------------------------------------
[profiles.default]

# === AI services ============================================================
NVIDIA_API_KEY      = { description = "NVIDIA NGC API key", required = true, type = "password" }
OPENAI_API_KEY      = { description = "OpenAI API key (chat, research, embeddings)", required = true, type = "password" }
ANTHROPIC_API_KEY   = { description = "Anthropic Claude API key", required = true, type = "password" }
OPENAI_ORG_ID       = { description = "OpenAI organization ID (for org-scoped API access)", required = true, pattern = "secrets.ai.yaml#openai_org_id" }
HUGGINGFACE_TOKEN   = { description = "HuggingFace Hub API token", required = true, type = "password", pattern = "secrets.ai.yaml#huggingface_token" }
STABILITY_API_KEY   = { description = "Stability AI API key", required = true, type = "password", pattern = "secrets.ai.yaml#stability_api_key" }
REPLICATE_API_TOKEN = { description = "Replicate API token", required = true, type = "password", pattern = "secrets.ai.yaml#replicate_api_token" }

# === CI =====================================================================
GITHUB_TOKEN             = { description = "GitHub PAT for repo automation and CI", required = true }
GITHUB_RUNNER_PAT        = { description = "Self-hosted GitHub Actions runner PAT", required = true }
NIX_PACKAGES_CACHE_TOKEN = { description = "Cachix/cirun nix package cache auth token", required = true, type = "password", pattern = "secrets.ci.yaml#nix_packages_cache_token" }

# === Cloud ==================================================================
CLOUDFLARE_TUNNEL_TOKEN  = { description = "cloudflared tunnel credential JSON", required = true, type = "password" }
CLOUDFLARE_API_KEY       = { description = "Cloudflare API key (DNS edit permissions)", required = true, type = "password" }
CLOUDFLARE_EMAIL         = { description = "Cloudflare account email (DNS edit auth)", required = true, pattern = "secrets.cloud.yaml#cloudflare_email" }
CLOUDFLARE_ZONE_ID       = { description = "Cloudflare zone ID for primary domain", required = true, pattern = "secrets.cloud.yaml#cloudflare_zone_id" }
TAILSCALE_AUTH_KEY       = { description = "Tailscale preauth key for new nodes", required = true }
HOMELAB_DUCKDNS_TOKEN    = { description = "DuckDNS update token for homelab subdomain", required = true, type = "password", pattern = "secrets.cloud.yaml#duckdns_token" }
ACME_ACCOUNT_KEY         = { description = "Let's Encrypt ACME account key (EAB)", required = true, type = "password", pattern = "secrets.cloud.yaml#acme_account_key" }

# === Storage ================================================================
# Master age encryption keys deliberately excluded from `keyring://` per
# sops-provider-design.md "Wallet key blocklist" — OS keyring is exfiltratable
# by local malware. BACKUP_ENCRYPTION_KEY falls under that blocklist (it's a
# master age encryption key), alongside the wallet keys in the Mining section.
GARAGE_ACCESS_KEY      = { description = "Garage S3 access key", required = true }
GARAGE_SECRET_KEY      = { description = "Garage S3 secret key", required = true, type = "password" }
RESTIC_REPO_PASSWORD   = { description = "Restic repository password", required = true, type = "password", pattern = "secrets.storage.yaml#restic_repo_password" }
RCLONE_CONFIG_PASS     = { description = "rclone config-file obfuscation passphrase", required = true, type = "password", pattern = "secrets.storage.yaml#rclone_config_passphrase" }
BACKUP_ENCRYPTION_KEY  = { description = "Restic/rclone age encryption key", required = true, type = "password", pattern = "secrets.storage.yaml#backup_encryption_key" }

# === Kubernetes =============================================================
K3S_CLUSTER_TOKEN   = { description = "K3s cluster bootstrap token", required = true, type = "password", pattern = "secrets.kubernetes.yaml#k3s_cluster_token" }
# base64 in env for Phase 1; later we'll revisit with as_path for raw file writes.
KUBECONFIG_ADMIN    = { description = "Base64-encoded admin kubeconfig (Phase 1)", required = true, pattern = "secrets.kubernetes.yaml#kubeconfig_admin" }
KUBEADMIN_PASSWORD  = { description = "Kubernetes dashboard admin password", required = true, type = "password", pattern = "secrets.kubernetes.yaml#kubeadmin_password" }
K3S_KUBELET_TOKEN   = { description = "K3s kubelet bootstrap token", required = true, type = "password", pattern = "secrets.kubernetes.yaml#k3s_kubelet_token" }
# KUBECONFIG_ADMIN_FUTURE = { description = "Path-mode admin kubeconfig", required = true, as_path = true }

# === Mining =================================================================
# Wallet keys deliberately excluded from `keyring://` per sops-provider-design.md
# blocklist (OS keyring is exfiltratable by local malware). These must resolve
# from `onepassword://` for daily use or `sops://` once PR #58 lands.
# Wallet *addresses* (below) are PUBLIC — never exfiltratable, never private —
# and are included for `sops://` route parity with their corresponding private
# keys, so Phase 2 YAML-key and Phase 3 provider assignments align row-for-row.
ETHEREUM_WALLET_KEY    = { description = "ETH wallet private key for mining pool", required = true, type = "password", pattern = "secrets.mining.yaml#ethereum_wallet_key" }
MONERO_WALLET_KEY      = { description = "XMR wallet private key for mining pool", required = true, type = "password", pattern = "secrets.mining.yaml#monero_wallet_key" }
ETHEREUM_WALLET_ADDRESS = { description = "ETH wallet public address (PUBLIC — mirrored here for sops:// route parity, not a secret)", required = true, pattern = "secrets.mining.yaml#ethereum_wallet_address" }
MONERO_WALLET_ADDRESS   = { description = "XMR wallet public address (PUBLIC — mirrored here for sops:// route parity, not a secret)", required = true, pattern = "secrets.mining.yaml#monero_wallet_address" }
MINING_POOL_USER       = { description = "Mining pool username", required = true }
MINING_POOL_PASS       = { description = "Mining pool password", required = true, type = "password" }

# === Monitoring =============================================================
GRAFANA_ADMIN_PASSWORD         = { description = "Initial Grafana admin password", required = true, type = "password" }
PROMETHEUS_REMOTE_WRITE_TOKEN  = { description = "Prometheus remote-write bearer token", required = true }
LOKI_INGEST_TOKEN              = { description = "Loki log ingestion bearer token", required = true, type = "password", pattern = "secrets.monitoring.yaml#loki_ingest_token" }
UPTIME_ROBOT_API_KEY           = { description = "UptimeRobot API key", required = true, type = "password", pattern = "secrets.monitoring.yaml#uptime_robot_api_key" }
GRAFANA_OAUTH_CLIENT_SECRET    = { description = "Grafana OAuth client secret (Google/GitHub OAuth)", required = true, type = "password", pattern = "secrets.monitoring.yaml#grafana_oauth_client_secret" }

# === Automation =============================================================
N8N_API_KEY                = { description = "n8n API key", required = true, type = "password" }
N8N_WEBHOOK_SECRET         = { description = "HMAC secret for n8n inbound webhooks", required = true, type = "hex" }
ANSIBLE_VAULT_PASSWORD     = { description = "Ansible Vault password", required = true, type = "password", pattern = "secrets.automation.yaml#ansible_vault_password" }
HOMELAB_RUNNER_REG_TOKEN   = { description = "act_runner registration token", required = true, type = "password", pattern = "secrets.automation.yaml#act_runner_reg_token" }

# === Self-hosting ===========================================================
VAULTWARDEN_ADMIN_TOKEN     = { description = "Vaultwarden admin token", required = true, type = "password" }
MAIL_SERVER_PASSWORD        = { description = "Mail server admin password", required = true, type = "password" }
JELLYFIN_API_KEY            = { description = "Jellyfin media-server API key", required = true, type = "password", pattern = "secrets.selfhosting.yaml#jellyfin_api_key" }
PAPERLESS_API_TOKEN         = { description = "Paperless-NGX API token", required = true, type = "password", pattern = "secrets.selfhosting.yaml#paperless_api_token" }
PHOTOPRISM_ADMIN_PASSWORD   = { description = "PhotoPrism admin password", required = true, type = "password", pattern = "secrets.selfhosting.yaml#photoprism_admin_password" }
MEALIE_API_KEY              = { description = "Mealie recipe-manager API key", required = true, type = "password", pattern = "secrets.selfhosting.yaml#mealie_api_key" }
VAULTWARDEN_SMTP_PASSWORD   = { description = "Vaultwarden SMTP relay password", required = true, type = "password", pattern = "secrets.selfhosting.yaml#vaultwarden_smtp_password" }
NETWORK_WIFI_PASSWORD       = { description = "Local WiFi PSK (low-risk per-host)", required = true, type = "password", pattern = "secrets.selfhosting.yaml#network_wifi_password" }


# ----------------------------------------------------------------------------
# Profile-wide provider defaults — apply to every secret in each profile
# unless overridden per-secret. Phase 1 uses only `env` + `dotenv` (no
# vault/keyring/onepassword available); the forward-looking providers
# (`onepassword`, `keyring`) are commented out in `[providers]` above
# and re-enabled in Phase 3 alongside the recovery code. All three
# profiles intentionally use the same provider chain in Phase 1; the
# per-profile `.defaults` blocks here exist so `secretspec check` can
# resolve the provider chain for default + development profiles (where
# it would otherwise return "No provider backend configured" because
# those profiles have no inline provider configuration).
# ----------------------------------------------------------------------------
[profiles.default.defaults]
providers = ["dotenv", "env"]

[profiles.production.defaults]
providers = ["dotenv", "env"]

[profiles.development.defaults]
providers = ["dotenv", "env"]


# ----------------------------------------------------------------------------
# Development profile — placeholder defaults so local dev works without a vault.
# Only the AI provider keys have placeholders; everything else still resolves
# from env or dotenv (which it does today). Description is inherited from default.
# ----------------------------------------------------------------------------
[profiles.development]
# Description may inherit from [profiles.default] but we repeat it explicitly
# — inheritance is documented for field *values*, not confirmed for `description`.
NVIDIA_API_KEY    = { description = "NVIDIA NGC API key", default = "nvapi-replace-me-locally" }
OPENAI_API_KEY    = { description = "OpenAI API key (chat, research, embeddings)", default = "sk-replace-me-locally" }
ANTHROPIC_API_KEY = { description = "Anthropic Claude API key", default = "ant-replace-me-locally" }
